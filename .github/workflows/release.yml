name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: # retry a failed release without re-tagging

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      # Published with npm, which reads the token setup-node writes to .npmrc. (pnpm 11 tried
      # OIDC instead and the registry answered 404, its way of saying "not authenticated".)
      - run: npm publish --access public --provenance --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
